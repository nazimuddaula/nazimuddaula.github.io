<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;align-items:flex-start;gap:10px;">
  <sc-if value="{{ iconIsLink }}" hint-placeholder-val="{{ true }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted,#6B6B6B)" stroke-width="1.5" style="flex-shrink:0;margin-top:3px;"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"></path><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.41-1.41"></path></svg>
  </sc-if>
  <sc-if value="{{ iconIsInfo }}" hint-placeholder-val="{{ false }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted,#6B6B6B)" stroke-width="1.5" style="flex-shrink:0;margin-top:3px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><circle cx="12" cy="8" r="0.5" fill="var(--muted,#6B6B6B)"></circle></svg>
  </sc-if>
  <sc-if value="{{ iconIsExternal }}" hint-placeholder-val="{{ false }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted,#6B6B6B)" stroke-width="1.5" style="flex-shrink:0;margin-top:3px;"><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path></svg>
  </sc-if>
  <p style="font-family:'Hepta Slab';font-weight:300;font-size:14px;line-height:1.5;margin:0;color:var(--muted,#6B6B6B);">{{ text }}<sc-for list="{{ linkItems }}" as="lnk" hint-placeholder-count="0"> <a href="{{ lnk.url }}" target="_blank" rel="noopener" style="color:#000080;text-decoration:underline;">{{ lnk.label }}</a></sc-for></p>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:500,&quot;height&quot;:50},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;link&quot;,&quot;options&quot;:[&quot;link&quot;,&quot;info&quot;,&quot;external&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Note text here.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;links&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;{label:string,url:string}[]&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const icon = this.props.icon ?? 'link';
    return {
      iconIsLink: icon === 'link',
      iconIsInfo: icon === 'info',
      iconIsExternal: icon === 'external',
      text: this.props.text ?? '',
      linkItems: this.props.links ?? []
    };
  }
}

</script>
</body>
</html>
